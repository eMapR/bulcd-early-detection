[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulcd-early-detection"
version = "0.1.0"
description = "Early detection and monitoring of land-cover, land-use, and vegetation change using BULC-D."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]
# Prototype notebooks (notebooks/). Earth Engine itself comes in via bulcd.
notebook = ["jupyterlab", "ipykernel", "matplotlib", "nbconvert", "ipyleaflet"]
# Regional batch processing (src/bulcd_early_detection/regional/): run files and tiling.
regional = ["pyyaml", "pyproj"]
# Pulls the BULC-D core engine straight from GitHub. Only needed for a
# from-scratch environment (CI, a new machine) that has no local
# BULC-D_rebuild checkout - see README "Relationship to BULC-D_rebuild".
# If you already installed bulcd yourself (e.g. `pip install -e
# ../BULC-D_rebuild`), skip this extra: `pip install -e .` alone leaves
# that install alone, while `pip install -e ".[engine]"` would try to
# reinstall bulcd from GitHub and overwrite it.
# Pinned to BULC-D_rebuild 8e9c5d5 (branch legacy-parity-0011): decision 0011
# (legacy S2 scene behavior and fracDOY time axis by default) plus gee/bulcd.js.
# Its main branch does not contain decision 0011. A local checkout should be at
# or after this commit; tests/test_bulcd_dependency.py checks.
engine = [
    "bulcd @ git+ssh://git@github.com/eMapR/BULC-D_rebuild.git@8e9c5d52e21b5ec57ccc2ad3328b5e7ce0b21bbb",
]

[tool.setuptools.packages.find]
where = ["src"]
